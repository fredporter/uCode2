[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ucode2"
version = "0.1.0-dev"
description = "uCode 2 — Spatial/3D Interpretation and Minecraft Voxel Lifter"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "uDos Team", email = "team@udos.io" },
]
keywords = ["udos", "ucode2", "spatial", "3d", "minecraft", "voxel", "nethack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.scripts]
ucode2 = "ucode2.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
